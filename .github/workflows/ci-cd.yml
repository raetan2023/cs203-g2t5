name: Test and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: ./mvnw --batch-mode --no-transfer-progress verify

  python:
    name: Forecast and data import tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ridge-regression-model/requirements-lock.txt
      - name: Install the model runtime and test-only SHAP dependency
        run: |
          python -m pip install -r ridge-regression-model/requirements-lock.txt \
            shap==0.54.1 slicer==0.0.8 tqdm==4.70.1
      - run: python -m pytest -q
        working-directory: ridge-regression-model
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - run: python -m unittest discover -s data-ingestion -p 'test_*.py'
      - run: python -m unittest discover -s tests -p 'test_run_launcher.py'

  production:
    name: Deploy to Azure and Vercel
    needs: [frontend, backend, python]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    concurrency:
      group: bunker-buddy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: bunker-rg
      AZURE_APP_NAME: bunker-buddy-api
      AZURE_ACR_NAME: bunkerg2t5acr
      BACKEND_URL: https://bunker-buddy-api.azurewebsites.net
      FRONTEND_URL: https://bunker-buddy-nine.vercel.app
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check this run is still for the latest main
        run: |
          if [[ "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]]; then
            echo "::error::Main has moved. Use the workflow for the latest commit."
            exit 1
          fi
      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install Vercel CLI
        run: npm install --global vercel@65.12.1
      - name: Build the frontend with its Vercel production settings
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          node --env-file=.vercel/.env.production.local --input-type=module <<'JS'
          if (process.env.VITE_API_URL?.replace(/\/$/, '') !== process.env.BACKEND_URL) {
            throw new Error('Vercel production VITE_API_URL must point to the Azure backend.');
          }
          if (!/^pk_(test|live)_.+/.test(process.env.VITE_CLERK_PUBLISHABLE_KEY ?? '')) {
            throw new Error('Set the Clerk publishable key in Vercel production settings.');
          }
          JS
          vercel build --prod --token "$VERCEL_TOKEN"
      - name: Build and push the backend image
        run: |
          image="$AZURE_ACR_NAME.azurecr.io/bunker-backend:$GITHUB_SHA"
          docker build --platform linux/amd64 --build-arg "APP_REVISION=$GITHUB_SHA" -t "$image" .
          az acr login --name "$AZURE_ACR_NAME"
          docker push "$image"
      - name: Deploy and verify the backend revision
        run: |
          if [[ "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]]; then
            echo "::error::Main moved during the build. Use the workflow for the latest commit."
            exit 1
          fi
          previous="$(az webapp config show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_APP_NAME" --query linuxFxVersion -o tsv)"
          target="DOCKER|$AZURE_ACR_NAME.azurecr.io/bunker-backend:$GITHUB_SHA"
          if [[ "$previous" != DOCKER\|* ]]; then
            echo "::error::Expected an existing App Service container image for rollback."
            exit 1
          fi
          az webapp config set --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_APP_NAME" \
            --linux-fx-version "$target" --output none

          for attempt in {1..36}; do
            if curl --fail --silent --max-time 5 "$BACKEND_URL/health?revision=$GITHUB_SHA" | \
              jq -e --arg revision "$GITHUB_SHA" '.status == "ok" and .revision == $revision' >/dev/null; then
              echo "Backend revision $GITHUB_SHA is healthy."
              exit 0
            fi
            sleep 10
          done

          echo "::error::The new backend did not become healthy."
          if [[ "$previous" != "$target" ]]; then
            az webapp config set --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_APP_NAME" \
              --linux-fx-version "$previous" --output none
            echo "Restored previous App Service image: $previous"
          fi
          exit 1
      - name: Deploy and check the live frontend
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --max-time 15 \
            --output /dev/null "$FRONTEND_URL"
