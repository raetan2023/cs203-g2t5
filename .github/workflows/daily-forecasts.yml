name: Daily GDELT inputs for recommendations

on:
  schedule:
    - cron: '17 0 * * *' # 08:17 Asia/Singapore; best-effort start time
  workflow_dispatch:
    inputs:
      publish:
        description: Write the validated GDELT count and tone observations to Supabase
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: brent-supabase-import
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event_name == 'workflow_dispatch' || vars.DAILY_FORECASTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test import validation
        run: python -m unittest discover -s data-ingestion -p 'test_*.py'
      - name: Synchronize completed GDELT days from the MGO API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--source gdelt --mode snapshot --require-completed-gdelt)
          if [[ "$PUBLISH" == "true" ]]; then args+=(--apply); fi
          {
            echo '### GDELT inputs for purchase recommendations'
            echo "- Database writes enabled: $PUBLISH"
            echo '- Source: MGO Data API snapshot. Estimated observations stay labelled.'
            echo '- The logs show the latest completed UTC day and its observation type.'
          } >> "$GITHUB_STEP_SUMMARY"
          python data-ingestion/import_market.py "${args[@]}"
