# ==============================================================================
# Spring Boot Configuration: application.properties
# Role: Configures the server port and disables database requirement
#       so the application pulls directly from https://mgo-data-api.vercel.app/
# ==============================================================================

# Server configuration
server.port=8080

# Disables hard database requirement (no Supabase connection required to run!)
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

# External API configuration
market.api.base-url=https://mgo-data-api.vercel.app
