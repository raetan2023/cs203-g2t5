<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bunker Buddy sign-in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0c0d0e}
a{color:#f0e6d2}a:hover{color:#eadfc9}
.scene{-webkit-mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent)}
.ship{animation:bob 9s ease-in-out infinite;transform-origin:420px 238px}
.w1{animation:flick 11s ease-in-out infinite}
.w2{animation:flick 17s ease-in-out infinite -5s}
.w3{animation:flick 23s ease-in-out infinite -9s}
.halo{animation:breathe 7s ease-in-out infinite}
.rf{animation:shimmer 4.5s ease-in-out infinite alternate}
.scene.still *{animation:none !important}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(1.6px) rotate(.12deg)}}
@keyframes flick{0%,100%{opacity:1}46%{opacity:1}50%{opacity:.25}54%{opacity:1}}
@keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes shimmer{0%{transform:translateX(-3px);opacity:.7}100%{transform:translateX(3px);opacity:1}}
@media (prefers-reduced-motion:reduce){.scene *{animation:none !important}}
.btn{transition:background .15s,border-color .15s}
.btn:hover{background:#242526;border-color:#3d3b36}
.btn-primary:hover{background:#f3ead7}
.field:focus{outline:2px solid #eadfc9;outline-offset:1px}
button:focus-visible,a:focus-visible{outline:2px solid #eadfc9;outline-offset:2px}
input::placeholder{color:#9c9484}
</style>
</helmet>
<div style="width:100%;min-height:860px;box-sizing:border-box;background:#0c0d0e;color:#f0e6d2;font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;padding:32px clamp(24px,6vw,86px) 56px;display:flex;flex-direction:column;gap:40px">

<header style="display:flex;align-items:center;gap:12px">
<span style="width:32px;height:32px;border-radius:50%;background:#eadfc9;display:inline-flex;align-items:center;justify-content:center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0c0d0e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="3"/><line x1="12" y1="22" x2="12" y2="8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/></svg>
</span>
<span style="font-size:22px;font-weight:500;letter-spacing:-0.01em;color:#f0e6d2">Bunker Buddy</span>
</header>

<main style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:48px 64px">

<section style="flex:1 1 520px;min-width:0;display:flex;flex-direction:column;gap:24px">
<h1 style="margin:0;font-size:clamp(40px,5vw,64px);line-height:1.1;font-weight:300;letter-spacing:-0.02em;color:#f0e6d2">A clearer course.<br>A smarter purchase.</h1>
<p style="margin:0;max-width:420px;font-size:18px;line-height:32px;color:#c5bba7">Navigate MGO price uncertainty with forecasts and a purchase plan built around you.</p>

<svg class="scene {{sceneClass}}" viewBox="0 0 800 340" role="img" aria-label="A tanker at night on dark water, lit only by its deck lights and bridge windows" style="display:block;width:100%;max-width:820px;height:auto;margin-top:8px">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0d0e"/><stop offset="1" stop-color="#1b1712"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14120f"/><stop offset=".35" stop-color="#0a0c0e"/><stop offset="1" stop-color="#0c0d0e"/></linearGradient>
<radialGradient id="haze" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2a241b" stop-opacity=".9"/><stop offset="1" stop-color="#2a241b" stop-opacity="0"/></radialGradient>
<linearGradient id="fadeGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".6" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="fade"><rect x="0" y="0" width="1" height="1" fill="url(#fadeGrad)"/></mask>
<pattern id="dash" width="14" height="14" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="10" height="2" fill="#eadfc9"/><rect x="5" y="7" width="9" height="2" fill="#eadfc9"/></pattern>
<filter id="blur6" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="blur3" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
<g id="rf"><rect x="0" y="0" width="12" height="64" fill="url(#dash)" mask="url(#fade)"/></g>
</defs>

<rect x="0" y="0" width="800" height="232" fill="url(#sky)"/>
<ellipse cx="420" cy="232" rx="420" ry="90" fill="url(#haze)"/>
<rect x="0" y="232" width="800" height="108" fill="url(#sea)"/>
<line x1="0" y1="232.5" x2="800" y2="232.5" stroke="#2a241b" stroke-width="1"/>
<path d="M60 262H250M430 270H700M170 292H520M570 304H770M90 318H300" stroke="#eadfc9" stroke-opacity=".05" stroke-width="1"/>

<g class="halo">
<rect x="170" y="108" width="62" height="18" fill="#eadfc9" opacity=".2" filter="url(#blur6)"/>
</g>

<g class="halo" filter="url(#blur3)" opacity=".55">
<circle cx="282" cy="189" r="5" fill="#eadfc9"/><circle cx="326" cy="189" r="5" fill="#eadfc9"/><circle cx="370" cy="189" r="5" fill="#eadfc9"/><circle cx="414" cy="189" r="5" fill="#eadfc9"/><circle cx="458" cy="189" r="5" fill="#eadfc9"/><circle cx="502" cy="189" r="5" fill="#eadfc9"/><circle cx="546" cy="189" r="5" fill="#eadfc9"/><circle cx="590" cy="189" r="5" fill="#eadfc9"/><circle cx="634" cy="189" r="5" fill="#eadfc9"/><circle cx="678" cy="189" r="5" fill="#eadfc9"/>
<circle cx="200" cy="56" r="5" fill="#eadfc9"/><circle cx="690" cy="164" r="5" fill="#eadfc9"/>
</g>

<g opacity=".55">
<rect class="rf" x="172" y="238" width="58" height="78" fill="url(#dash)" mask="url(#fade)" style="animation-delay:-1s"/>
</g>
<g opacity=".4">
<use class="rf" href="#rf" x="276" y="238" style="animation-delay:-0.5s"/>
<use class="rf" href="#rf" x="320" y="238" style="animation-delay:-1.8s"/>
<use class="rf" href="#rf" x="364" y="238" style="animation-delay:-2.6s"/>
<use class="rf" href="#rf" x="408" y="238" style="animation-delay:-3.4s"/>
<use class="rf" href="#rf" x="452" y="238" style="animation-delay:-0.9s"/>
<use class="rf" href="#rf" x="496" y="238" style="animation-delay:-2.1s"/>
<use class="rf" href="#rf" x="540" y="238" style="animation-delay:-3.9s"/>
<use class="rf" href="#rf" x="584" y="238" style="animation-delay:-1.2s"/>
<use class="rf" href="#rf" x="628" y="238" style="animation-delay:-2.9s"/>
<use class="rf" href="#rf" x="672" y="238" style="animation-delay:-0.2s"/>
</g>

<g class="ship">
<path d="M118 198H706L734 188L676 238H118Z" fill="#101214"/>
<path d="M118 198H706L734 188" fill="none" stroke="#2a241b" stroke-width="1"/>
<path d="M118 228H640" stroke="#16181b" stroke-width="3"/>

<path d="M182 130L188 84H212L218 130Z" fill="#121417"/>
<rect x="186" y="80" width="28" height="4" fill="#15171a"/>
<rect x="187" y="100" width="26" height="2" fill="#eadfc9" opacity=".3"/>

<rect x="146" y="160" width="108" height="38" fill="#14161a"/>
<rect x="158" y="130" width="84" height="30" fill="#15181c"/>
<rect x="166" y="108" width="68" height="22" fill="#171a1e"/>
<rect x="160" y="124" width="80" height="3" fill="#1b1e22"/>

<path d="M200 108V56M192 70H208" stroke="#23262b" stroke-width="2"/>
<circle cx="200" cy="56" r="1.8" fill="#eadfc9"/>

<g fill="#eadfc9">
<rect x="174" y="114" width="6" height="5"/><rect x="184" y="114" width="6" height="5"/><rect class="w1" x="194" y="114" width="6" height="5"/><rect x="204" y="114" width="6" height="5"/><rect class="w2" x="214" y="114" width="6" height="5"/><rect x="224" y="114" width="6" height="5"/>
<rect x="168" y="141" width="5" height="5"/><rect x="180" y="141" width="5" height="5"/><rect class="w3" x="204" y="141" width="5" height="5"/><rect x="216" y="141" width="5" height="5"/>
<rect class="w2" x="156" y="173" width="5" height="5" opacity=".8"/><rect x="180" y="173" width="5" height="5" opacity=".8"/><rect x="216" y="173" width="5" height="5" opacity=".8"/><rect class="w1" x="240" y="173" width="5" height="5" opacity=".8"/>
</g>

<path d="M262 192H700" stroke="#1a1d21" stroke-width="3"/>
<rect x="436" y="182" width="48" height="16" fill="#14161a"/>
<path d="M300 198V192M350 198V192M400 198V192M540 198V192M600 198V192M650 198V192" stroke="#1a1d21" stroke-width="2"/>
<path d="M520 198V158L574 176" fill="none" stroke="#1d2024" stroke-width="2"/>
<rect x="640" y="176" width="52" height="22" fill="#14161a"/>
<path d="M690 176V164M684 168H696" stroke="#23262b" stroke-width="2"/>
<circle cx="690" cy="164" r="1.8" fill="#eadfc9"/>

<path d="M282 198V190M326 198V190M370 198V190M414 198V190M458 198V190M502 198V190M546 198V190M590 198V190M634 198V190M678 198V190" stroke="#2a2d32" stroke-width="1.4"/>
<g fill="#eadfc9">
<circle cx="282" cy="189" r="1.8"/><circle cx="326" cy="189" r="1.8"/><circle cx="370" cy="189" r="1.8"/><circle cx="414" cy="189" r="1.8"/><circle cx="458" cy="189" r="1.8"/><circle cx="502" cy="189" r="1.8"/><circle cx="546" cy="189" r="1.8"/><circle cx="590" cy="189" r="1.8"/><circle cx="634" cy="189" r="1.8"/><circle cx="678" cy="189" r="1.8"/>
</g>
<path d="M262 197.5H706" stroke="#eadfc9" stroke-opacity=".22" stroke-width="1"/>
</g>
</svg>
</section>

<section style="flex:0 1 470px;width:100%;max-width:470px;box-sizing:border-box;background:#1a1b1c;border:1px solid #2d2c29;border-radius:12px;padding:40px 32px 32px;display:flex;flex-direction:column;gap:24px">
<div style="display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center">
<span style="width:48px;height:48px;border-radius:10px;background:#0c0d0e;border:1px solid #2d2c29;display:inline-flex;align-items:center;justify-content:center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#eadfc9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="3"/><line x1="12" y1="22" x2="12" y2="8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/></svg>
</span>
<h2 style="margin:0;font-size:30px;line-height:38px;font-weight:400;letter-spacing:-0.01em;color:#f0e6d2">Sign in to Bunker Buddy</h2>
<p style="margin:0;font-size:14px;line-height:20px;color:#b5ac9b">Welcome back! Please sign in to continue</p>
</div>

<div style="display:flex;flex-wrap:wrap;gap:12px">
<button type="button" class="btn" style="flex:1 1 180px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:10px;background:#1a1b1c;border:1px solid #2d2c29;border-radius:6px;color:#f0e6d2;font:inherit;font-size:14px;font-weight:500;cursor:pointer">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47a5.54 5.54 0 0 1-2.4 3.63v3h3.88c2.27-2.09 3.55-5.17 3.55-8.87z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.27v3.09A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.27 14.29A7.2 7.2 0 0 1 4.9 12c0-.8.14-1.57.37-2.29V6.62H1.27A12 12 0 0 0 0 12c0 1.94.46 3.77 1.27 5.38l4-3.09z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.43-3.43C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.27 6.62l4 3.09C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
Google
</button>
<button type="button" class="btn" style="flex:1 1 180px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:10px;background:#1a1b1c;border:1px solid #2d2c29;border-radius:6px;color:#f0e6d2;font:inherit;font-size:14px;font-weight:500;cursor:pointer">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="9.5" height="9.5" fill="#F25022"/><rect x="12.5" y="2" width="9.5" height="9.5" fill="#7FBA00"/><rect x="2" y="12.5" width="9.5" height="9.5" fill="#00A4EF"/><rect x="12.5" y="12.5" width="9.5" height="9.5" fill="#FFB900"/></svg>
Microsoft
</button>
</div>

<div style="display:flex;align-items:center;gap:16px;color:#b5ac9b;font-size:13px">
<span style="flex:1;height:1px;background:#2d2c29"></span>or<span style="flex:1;height:1px;background:#2d2c29"></span>
</div>

<form style="display:flex;flex-direction:column;gap:20px" onsubmit="return false">
<div style="display:flex;flex-direction:column;gap:8px">
<label for="email" style="font-size:13px;line-height:18px;font-weight:600;color:#f0e6d2">Email address</label>
<input id="email" class="field" type="email" placeholder="you@company.com" autocomplete="email" style="box-sizing:border-box;width:100%;min-height:48px;padding:0 14px;background:{{inputBg}};border:1px solid #2d2c29;border-radius:6px;color:#f0e6d2;font:inherit;font-size:14px">
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">
<label for="pw" style="font-size:13px;line-height:18px;font-weight:600;color:#f0e6d2">Password</label>
<a href="#forgot" style="font-size:13px;line-height:18px;font-weight:600;color:#f0e6d2">Forgot password?</a>
</div>
<div style="position:relative;display:flex">
<input id="pw" class="field" type="{{pwType}}" placeholder="Enter your password" autocomplete="current-password" style="box-sizing:border-box;width:100%;min-height:48px;padding:0 52px 0 14px;background:{{inputBg}};border:1px solid #2d2c29;border-radius:6px;color:#f0e6d2;font:inherit;font-size:14px">
<button type="button" onClick="{{togglePw}}" aria-label="{{eyeLabel}}" aria-pressed="{{showPw}}" style="position:absolute;right:0;top:0;width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;color:#c5bba7;cursor:pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
</button>
</div>
</div>
<button type="submit" class="btn-primary" style="min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:10px;background:#eadfc9;border:0;border-radius:6px;color:#0c0d0e;font:inherit;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px">
Continue
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0c0d0e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
</button>
</form>

<p style="margin:4px 0 0;text-align:center;font-size:14px;line-height:20px;color:#b5ac9b">Don't have an account? <a href="#signup" style="font-weight:600">Sign up</a></p>
<p style="margin:0;padding-top:16px;border-top:1px solid #2d2c29;text-align:center;font-size:12px;line-height:16px;color:#b5ac9b">Secured by Clerk</p>
</section>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"boolean","default":true},"inputTone":{"editor":"enum","options":["warm","slate"],"default":"warm"},"$preview":{"width":1440,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const show = !!(this.state && this.state.showPw);
    const motion = this.props.motion !== false;
    const slate = this.props.inputTone === 'slate';
    return {
      showPw: show,
      pwType: show ? 'text' : 'password',
      eyeLabel: show ? 'Hide password' : 'Show password',
      togglePw: () => this.setState({ showPw: !show }),
      sceneClass: motion ? 'live' : 'still',
      inputBg: slate ? '#2c3443' : '#232220'
    };
  }
}
</script>
</body>
</html>
