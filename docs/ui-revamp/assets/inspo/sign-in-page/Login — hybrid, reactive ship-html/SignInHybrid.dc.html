<html lang="en">
<head>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0c0d0e}
.scene{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.bob{animation:bob 9s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.sail{transition:transform 2.6s cubic-bezier(.45,0,.2,1)}
.scene.go .sail{transform:translateX(70px)}
.wake{opacity:0;transition:opacity 1.2s ease .3s}
.scene.go .wake{opacity:1}
.draw{stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1.8s ease .6s}
.scene.go .draw{stroke-dashoffset:0}
.wp{opacity:0;transition:opacity .6s ease 2.2s}
.scene.go .wp{opacity:1}
.wpring{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.lt,.hl,.bridge,.refl,.deckglow,.beam{transition:opacity .45s ease}
.lt.on{opacity:.9}.lt.hot{opacity:1}.lt.off{opacity:.4}
.hl.on{opacity:.4}.hl.hot{opacity:.7}.hl.off{opacity:.12}
.bridge.on{opacity:.9}.bridge.hot{opacity:1}.bridge.off{opacity:.55}
.bglow{opacity:.25;transition:opacity .6s ease}
.bridge.hot .bglow{opacity:.42}
.refl{opacity:.55}.deckglow{opacity:.3}
.scene.dim .refl{opacity:.35}.scene.dim .deckglow{opacity:.18}
.rf{animation:shimmer 4.5s ease-in-out infinite alternate}
.w1{animation:flick 11s ease-in-out infinite}
.w2{animation:flick 17s ease-in-out infinite -5s}
.twinkle{opacity:.4}
.t2{animation-delay:-2s}.t3{animation-delay:-3.5s}
.shake{animation:shake .45s ease}
.spin{animation:spin .9s linear infinite;transform-origin:center;transform-box:fill-box}
.scene.still *{animation:none !important}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(1.6px) rotate(.12deg)}}
@keyframes flick{0%,100%{opacity:1}46%{opacity:1}50%{opacity:.25}54%{opacity:1}}
@keyframes shimmer{0%{transform:translateX(-3px)}100%{transform:translateX(3px)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.7}}
@keyframes flash{0%{opacity:1}100%{opacity:.05}}
@keyframes sweep{0%{transform:rotate(-14deg)}100%{transform:rotate(10deg)}}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.scene *,.shake{animation:none !important;transition:none !important}}
.uline{transition:border-color .2s,box-shadow .2s}
.uline:focus{outline:none;border-bottom-color:#17140f;box-shadow:0 1px 0 0 #17140f}
.pill{transition:background .15s,transform .1s}
.pill:active{transform:scale(.985)}
.pill-dark:hover{background:#2b261f}
.pill-light:hover{background:#e1d7c4}
.card a{color:#17140f}
.card button:focus-visible,.card a:focus-visible,.card input[type=checkbox]:focus-visible{outline:2px solid #17140f;outline-offset:2px}
input::placeholder{color:#857b6a}
</style>
</helmet>

<div style="position:relative;display:flex;flex-wrap:wrap;justify-content:space-between;gap:32px 64px;padding:32px clamp(20px,6vw,86px) 48px;min-height:900px;box-sizing:border-box">

<section style="flex:1 1 480px;min-width:0;display:flex;flex-direction:column;gap:56px">
<header style="display:flex;align-items:center;gap:12px">
<span style="width:32px;height:32px;border-radius:50%;background:#eadfc9;display:inline-flex;align-items:center;justify-content:center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0c0d0e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="3"></circle><line x1="12" y1="22" x2="12" y2="8"></line><path d="M5 12H2a10 10 0 0 0 20 0h-3"></path></svg>
</span>
<span style="font-size:20px;font-weight:600;letter-spacing:-0.02em">Bunker Buddy</span>
</header>
<div style="display:flex;flex-direction:column;gap:20px;max-width:620px">
<h1 style="margin:0;font-size:clamp(40px,4.4vw,58px);line-height:1.06;font-weight:500;letter-spacing:-0.035em;color:#f0e6d2">A clearer course.<br>A smarter purchase.</h1>
<p style="margin:0;max-width:420px;font-size:18px;line-height:30px;color:#c5bba7">Navigate MGO price uncertainty with forecasts and a purchase plan built around you.</p>
</div>
</section>

<div class="cardwrap" style="flex:0 1 440px;width:100%;max-width:440px;align-self:center">
<section class="card {{cardCls}}" aria-label="Sign in" style="box-sizing:border-box;background:#f5efe3;color:#17140f;border-radius:20px;padding:40px 36px 32px;box-shadow:0 30px 80px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:28px">

<div style="display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center">
<span style="width:44px;height:44px;border-radius:50%;background:#17140f;display:inline-flex;align-items:center;justify-content:center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f5efe3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="3"></circle><line x1="12" y1="22" x2="12" y2="8"></line><path d="M5 12H2a10 10 0 0 0 20 0h-3"></path></svg>
</span>
<h2 style="margin:0;font-size:28px;line-height:34px;font-weight:600;letter-spacing:-0.01em">Sign in</h2>
</div>

<sc-if value="{{ notSuccess }}" hint-placeholder-val="{{ true }}">
<form onSubmit="{{submit}}" novalidate="" style="display:flex;flex-direction:column;gap:22px">
<div style="display:flex;flex-direction:column;gap:4px">
<label for="h-email" style="font-size:12px;line-height:16px;font-weight:600;color:#5f574b">Email</label>
<input id="h-email" name="email" class="uline" type="email" placeholder="you@company.com" autocomplete="email" onFocus="{{fEmail}}" onBlur="{{blur}}" onInput="{{inEmail}}" style="box-sizing:border-box;width:100%;min-height:44px;padding:8px 0;background:transparent;border:0;border-bottom:1.5px solid #b9ae99;border-radius:0;color:#17140f;font:inherit;font-size:17px">
</div>
<div style="display:flex;flex-direction:column;gap:4px">
<label for="h-pw" style="font-size:12px;line-height:16px;font-weight:600;color:#5f574b">Password</label>
<div style="position:relative;display:flex">
<input id="h-pw" name="password" class="uline" type="{{pwType}}" placeholder="Your password" autocomplete="current-password" onFocus="{{fPw}}" onBlur="{{blur}}" onInput="{{inPw}}" style="box-sizing:border-box;width:100%;min-height:44px;padding:8px 48px 8px 0;background:transparent;border:0;border-bottom:1.5px solid #b9ae99;border-radius:0;color:#17140f;font:inherit;font-size:17px">
<button type="button" onClick="{{togglePw}}" aria-label="{{eyeLabel}}" aria-pressed="{{showPw}}" style="position:absolute;right:-6px;top:0;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;color:#3a342b;cursor:pointer">
<sc-if value="{{ showPw }}" hint-placeholder-val="{{ false }}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</sc-if>
<sc-if value="{{ hidePw }}" hint-placeholder-val="{{ true }}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
</sc-if>
</button>
</div>
</div>

<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px">
<label style="display:inline-flex;align-items:center;gap:8px;min-height:32px;font-size:13px;color:#3a342b;cursor:pointer"><input type="checkbox" name="remember" style="width:16px;height:16px;margin:0;accent-color:#17140f">Remember for 30 days</label>
<a href="#forgot" style="font-size:13px;font-weight:600">Forgot password?</a>
</div>

<sc-if value="{{ hasErr }}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin:-8px 0 0;font-size:13px;line-height:18px;color:#9b2c1a">{{errMsg}}</p>
</sc-if>

<div style="display:flex;flex-direction:column;gap:12px">
<button type="submit" class="pill pill-dark" aria-busy="{{loading}}" style="min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:10px;background:#17140f;border:0;border-radius:26px;color:#f5efe3;font:inherit;font-size:15px;font-weight:600;cursor:pointer">
<sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
<svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f5efe3" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.6"></path></svg>
</sc-if>
{{btnLabel}}
</button>

<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const s = this.state || {};
    const focus = s.focus || null;
    const emailLen = s.emailLen || 0;
    const showPw = !!s.showPw;
    const phase = s.phase || 'idle';
    const beam = s.beam == null ? -8 : s.beam;
    const errMsg = s.errMsg || '';
    const motion = this.props.motion !== false;
    const busy = phase === 'loading' || phase === 'success';
    const hiding = !busy && focus === 'pw' && !showPw;

    const level = (i) => {
      if (busy) return 'hot';
      if (hiding) return 'off';
      if (focus === 'email') return i < emailLen ? 'hot' : 'off';
      return 'on';
    };
    const vals = {};
    for (let i = 0; i < 10; i++) vals['d' + i] = level(i);

    const bridgeCls = busy ? 'hot' : hiding ? 'off' : focus === 'email' ? 'hot' : 'on';
    const sceneCls = [
      motion ? '' : 'still',
      hiding ? 'dim' : '',
      phase === 'error' ? 'err' : '',
      phase === 'loading' ? 'loading' : '',
      phase === 'success' ? 'go' : ''
    ].join(' ');

    const set = (patch) => this.setState(Object.assign({}, this.state || {}, patch));
    const emailOk = (v) => /\S+@\S+\.\S+/.test(v);

    return Object.assign(vals, {
      beam,
      bridgeCls,
      sceneCls,
      cardCls: '',
      showPw,
      hidePw: !showPw,
      pwType: showPw ? 'text' : 'password',
      eyeLabel: showPw ? 'Hide password' : 'Show password',
      loading: phase === 'loading',
      btnLabel: phase === 'loading' ? 'Signing in…' : 'Sign in',
      success: phase === 'success',
      notSuccess: phase !== 'success',
      hasErr: !!errMsg,
      errMsg,
      fEmail: () => set({ focus: 'email' }),
      fPw: () => set({ focus: 'pw' }),
      blur: () => set({ focus: null }),
      inEmail: (e) => set({ emailLen: e.target.value.length, errMsg: '' }),
      inPw: () => { if (errMsg) set({ errMsg: '' }); },
      togglePw: () => set({ showPw: !showPw }),
      onMove: (e) => {
        if (busy) return;
        const r = e.currentTarget.getBoundingClientRect();
        const sc = Math.max(r.width / 1440, Math.min(r.height, 900) / 900);
        const x = (e.clientX - r.left) / sc;
        const y = (e.clientY - r.top - (Math.min(r.height, 900) - 900 * sc)) / sc;
        const a = Math.atan2(y - 499, x - 130) * 180 / Math.PI;
        const clamped = Math.max(-28, Math.min(18, a));
        if (Math.abs(clamped - beam) > 0.5) set({ beam: Math.round(clamped * 10) / 10 });
      },
      submit: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (busy) return;
        const f = e.currentTarget.elements;
        const em = (f.email && f.email.value) || '';
        const pw = (f.password && f.password.value) || '';
        let msg = '';
        if (!em) msg = 'Enter your email address.';
        else if (!emailOk(em)) msg = 'That email address doesn’t look right.';
        else if (!pw) msg = 'Enter your password.';
        clearTimeout(this._t);
        if (msg) {
          set({ phase: 'error', errMsg: msg });
          this._t = setTimeout(() => set({ phase: 'idle' }), 1200);
          return;
        }
        set({ phase: 'loading', focus: null, errMsg: '' });
        this._t = setTimeout(() => set({ phase: 'success' }), 1800);
      },
      replay: () => {
        clearTimeout(this._t);
        set({ phase: 'idle', focus: null, emailLen: 0, showPw: false, errMsg: '', beam: -8 });
      }
    });
  }
}
</script>
