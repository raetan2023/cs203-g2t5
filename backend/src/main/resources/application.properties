spring.application.name=mgo-data-api
server.port=${PORT:8000}

# Intentionally public for the academic demo. Set MGO_API_KEY to replace it.
mgo.api-key=${MGO_API_KEY:mgo_public_demo_2026}
# Relative to the working directory; the default works when run from backend/.
mgo.snapshot-dir=${MGO_SNAPSHOT_DIR:data/snapshots}

# The historical scenario every feature treats as "today". Agree changes with the
# dashboard and purchase-plan owners so both pages show the same date.
mgo.scenario-date=${MGO_SCENARIO_DATE:2025-10-24}

# Postgres is named explicitly so startup does not depend on reaching the database
# first: without this Hibernate connects just to detect the dialect, and the whole
# application fails to start when the database is unreachable.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Browser origins allowed to call /api/. Vite serves 127.0.0.1 and localhost as
# separate origins, so both are listed. Add deployed origins here when they exist.
# Codespaces and other hosted dev environments are added here, not in a second
# configuration class: a wider /** mapping loses to this one and silently does nothing.
mgo.frontend-origins=${FRONTEND_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}

# Verifies session tokens against the identity provider's published signing keys.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${CLERK_ISSUER_URI:https://sterling-sawfish-1624.clerk.accounts.dev}

# Supabase Postgres. Set these from the project's Connect dialog; see README.
# The app will not start without them.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
# Supabase requires TLS; keep the pool small on the free tier's 60-connection limit.
spring.datasource.hikari.maximum-pool-size=${SUPABASE_DB_POOL_SIZE:5}

springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/openapi.json
