spring.application.name=mgo-data-api
server.port=${PORT:8000}

# Intentionally public for the academic demo. Set MGO_API_KEY to replace it.
mgo.api-key=${MGO_API_KEY:mgo_public_demo_2026}
# Relative to the working directory; the default works when run from backend/.
mgo.snapshot-dir=${MGO_SNAPSHOT_DIR:data/snapshots}

springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/openapi.json
